name: Build Android app

# Trigger from your phone: GitHub app/site → Actions → "Build Android app" →
# Run workflow. Also runs automatically when app code changes on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ToyboxFull.tsx"
      - "src/**"
      - "public/**"
      - "index.html"
      - "capacitor.config.json"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish the APK to a GitHub Release
    # Secrets are surfaced as env vars so they can be checked in `if:` conditions
    # (secrets can't be referenced directly in `if:`). Release steps run only
    # when the keystore secret is set.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      # ── Debug APK — always built, installable directly on a phone for testing.
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: toybox-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ── Tap-to-install: attach the APK to a Release so you can install it
      #    directly from your phone browser (no unzipping). Always the latest.
      - name: Rename APK for the Release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk toybox-trader-test.apk

      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "📱 Toybox Trader — latest Android test build"
          body: |
            Tap **toybox-trader-test.apk** below to install the latest test build
            on your Android phone. You may need to allow "install from this source".

            This is a test build (debug). Built from commit ${{ github.sha }}.
          prerelease: true
          files: toybox-trader-test.apk

      # ── Signed release AAB — built only when the signing secrets are set.
      #    Upload this file to the Google Play Console.
      - name: Prepare keystore
        id: keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "path=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release AAB
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload release AAB
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: toybox-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
