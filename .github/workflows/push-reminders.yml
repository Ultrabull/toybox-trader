name: Push reminders

# Runs hourly. Each device gets: the daily bonus reminder at its own local 4pm,
# and the weekly "report is ready" push on Sunday at its own local 6pm.
# Replaces the Netlify scheduled push function.
on:
  schedule:
    - cron: "0 * * * *" # every hour on the hour
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: node scripts/send-push.mjs
      # Weekly "report is ready" push — self-gates to Sunday ~6pm local time.
      - run: node scripts/send-report-push.mjs
