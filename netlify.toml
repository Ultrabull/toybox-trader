# Netlify build settings for Toybox Trader.
# On every push to the connected branch, Netlify runs this build and
# publishes the resulting HTML bundle from dist/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Serverless functions (Neon-backed cloud storage) live here.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # web-push ships helper deps that bundle poorly; keep it as an installed module.
  external_node_modules = ["web-push"]

# Single-page app: serve index.html for any path so refreshes and deep
# links don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
